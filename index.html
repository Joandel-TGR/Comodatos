<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2430">
<title>Consulta Comodatos</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===================== TELA INICIAL ===================== -->
<div id="homeView" class="view home-view">
  <header class="home-hero">
    <div class="home-brand-row">
      <img src="icons/brand/logo-tgr.png" alt="TGR Bebidas" class="home-logo">
      <img src="icons/brand/handshake.png" alt="" class="home-handshake" aria-hidden="true">
    </div>
    <h1 class="home-title">Consulta Comodatos</h1>
    <p class="home-subtitle">Selecione seu código de vendedor para começar</p>
  </header>

  <div class="home-inner">
    <div id="vendGrid" class="vend-grid" aria-label="Selecionar vendedor">
      <p class="home-loading">carregando vendedores…</p>
    </div>

    <button id="vendAllBtn" type="button" class="all-btn">
      <span>Ver todos os clientes</span>
      <svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M8 4l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <p id="updateStatus" class="update-status" hidden></p>
  </div>

  <div class="home-wave" aria-hidden="true">
    <svg viewBox="0 0 390 58" preserveAspectRatio="none" width="100%" height="100%">
      <defs>
        <linearGradient id="waveBright" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#B8141D"/>
          <stop offset="0.4" stop-color="#E81B24"/>
          <stop offset="0.8" stop-color="#F3232B"/>
          <stop offset="1" stop-color="#F5434A"/>
        </linearGradient>
        <linearGradient id="waveDark" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#9E0F18"/>
          <stop offset="0.35" stop-color="#A60E16"/>
          <stop offset="1" stop-color="#7C0710"/>
        </linearGradient>
      </defs>
      <path d="M0,30 C70,40 130,48 195,48 C280,48 345,30 390,0 L390,58 L0,58 Z" fill="url(#waveBright)"/>
      <path d="M0,58 L0,52 C100,55 200,53 290,44 C335,38 365,30 390,20 L390,58 Z" fill="url(#waveDark)"/>
    </svg>
  </div>
</div>

<!-- ===================== TELA DE CONSULTA ===================== -->
<div id="consultaView" class="view consulta-view" hidden>
  <header class="topbar">
    <div class="topbar-row">
      <button id="backBtn" type="button" class="back-btn" aria-label="Voltar">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M12 4l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="title-block">
        <h1>Consulta Comodatos</h1>
        <p id="dbInfo" class="subtitle">carregando base…</p>
      </div>
      <img src="icons/brand/handshake.png" alt="" class="topbar-handshake" aria-hidden="true">
    </div>

    <div class="vend-chip-row">
      <span id="vendChip" class="vend-chip"></span>
      <button id="trocarVendBtn" type="button" class="ghost-btn">Trocar vendedor</button>
    </div>

    <div class="search-row">
      <input id="searchInput" type="search" inputmode="search" placeholder="Buscar por código ou nome do cliente" autocomplete="off" aria-label="Buscar cliente">
    </div>

    <div class="filter-row">
      <select id="cidadeFilter" aria-label="Filtrar por cidade">
        <option value="">Todas as cidades</option>
      </select>
      <button id="clearFilters" class="ghost-btn" type="button">Limpar</button>
    </div>
  </header>

  <main>
    <div id="resultCount" class="result-count"></div>
    <ul id="clientList" class="client-list" aria-live="polite"></ul>
    <div id="emptyState" class="empty-state" hidden></div>
  </main>

  <footer class="footnote">
    <span id="totalFooter"></span>
  </footer>
</div>

<script src="app.js"></script>
</body>
</html>
