<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2430">
<title>Comodatos</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-row">
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 40 40" width="30" height="30">
        <circle cx="20" cy="20" r="18" fill="none" stroke="currentColor" stroke-width="2.4"/>
        <path d="M12 21.5 L18 27 L29 14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="title-block">
      <h1>Comodatos</h1>
      <p id="dbInfo" class="subtitle">carregando base…</p>
    </div>
  </div>

  <div class="search-row">
    <input id="searchInput" type="search" inputmode="search" placeholder="Buscar por código ou nome do cliente" autocomplete="off" aria-label="Buscar cliente">
  </div>

  <div class="filter-row">
    <select id="cidadeFilter" aria-label="Filtrar por cidade">
      <option value="">Todas as cidades</option>
    </select>
    <select id="vendFilter" aria-label="Filtrar por vendedor">
      <option value="">Todos os vendedores</option>
    </select>
    <button id="clearFilters" class="ghost-btn" type="button">Limpar</button>
  </div>
</header>

<main>
  <div id="resultCount" class="result-count"></div>
  <ul id="clientList" class="client-list" aria-live="polite"></ul>
  <p id="emptyState" class="empty-state" hidden>
    Nenhum cliente encontrado com esses filtros.<br>
    Tente outro código, nome ou limpe os filtros.
  </p>
</main>

<footer class="footnote">
  <span id="totalFooter"></span>
</footer>

<script src="app.js"></script>
</body>
</html>
