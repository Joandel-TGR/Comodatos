<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B2430">
<title>Consulta Comodatos</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===================== TELA INICIAL ===================== -->
<div id="homeView" class="view home-view">
  <div class="home-brand-row">
    <img src="icons/brand/logo-tgr.png" alt="TGR Bebidas" class="home-logo">
    <img src="icons/brand/handshake.png" alt="" class="home-handshake" aria-hidden="true">
  </div>
  <div class="home-inner">
    <h1 class="home-title">Consulta Comodatos</h1>
    <p class="home-subtitle">Selecione seu código de vendedor para começar</p>

    <div id="vendGrid" class="vend-grid" aria-label="Selecionar vendedor">
      <p class="home-loading">carregando vendedores…</p>
    </div>

    <button id="vendAllBtn" type="button" class="link-btn">Ver todos os clientes, sem filtrar por vendedor</button>
  </div>
</div>

<!-- ===================== TELA DE CONSULTA ===================== -->
<div id="consultaView" class="view consulta-view" hidden>
  <header class="topbar">
    <div class="topbar-row">
      <button id="backBtn" type="button" class="back-btn" aria-label="Voltar">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M12 4l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <div class="title-block">
        <h1>Consulta Comodatos</h1>
        <p id="dbInfo" class="subtitle">carregando base…</p>
      </div>
      <img src="icons/brand/handshake.png" alt="" class="topbar-handshake" aria-hidden="true">
    </div>

    <div class="vend-chip-row">
      <span id="vendChip" class="vend-chip"></span>
      <button id="trocarVendBtn" type="button" class="ghost-btn">Trocar vendedor</button>
    </div>

    <div class="search-row">
      <input id="searchInput" type="search" inputmode="search" placeholder="Buscar por código ou nome do cliente" autocomplete="off" aria-label="Buscar cliente">
    </div>

    <div class="filter-row">
      <select id="cidadeFilter" aria-label="Filtrar por cidade">
        <option value="">Todas as cidades</option>
      </select>
      <button id="clearFilters" class="ghost-btn" type="button">Limpar</button>
    </div>
  </header>

  <main>
    <div id="resultCount" class="result-count"></div>
    <ul id="clientList" class="client-list" aria-live="polite"></ul>
    <p id="emptyState" class="empty-state" hidden>
      Nenhum cliente encontrado com esses filtros.<br>
      Tente outro código, nome ou limpe os filtros.
    </p>
  </main>

  <footer class="footnote">
    <span id="totalFooter"></span>
  </footer>
</div>

<script src="app.js"></script>
</body>
</html>
